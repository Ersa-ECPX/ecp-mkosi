# Installer image: the same OS in a layout small enough for a USB stick. Build it with
#   scripts/build x86-64 --profile installer
# and keep the normal image (scripts/build x86-64) for QEMU testing. The live session starts the
# graphical installer (ersa-installer) automatically; `foundation deploy` also works from a terminal.
#
# The installer medium is never written to:
#   - the root is a read-only EROFS image, labelled ecp-live_<version> (the installed slot is ecp-root_<version>,
#     so the two can be told apart when both disks are attached);
#   - /var and /home are RAM disks (kernel command line below; sysroot-var-lib-ecp.mount in the initrd adds one
#     for the /etc overlay, labelled for SELinux);
#   - there is no data partition; the one extra partition, ECP-LIVE-EXT, is a read-only EROFS image holding the
#     installer sysext, mounted at /var/lib/extensions so systemd-sysext merges it at boot;
#   - the kernel image has no boot counter in its name, so systemd-boot never renames it on the ESP.
# The root image is otherwise the same as the normal build. The installer is a sysext (scripts/build-installer-sysext,
# staged below); it brings the live session (liveuser, automatic sign-in, polkit rule, autostart), which therefore
# never exists in the image Deploy copies.
[Content]
ExtraTrees=%D/mkosi.installer.extra:/
UnifiedKernelImageFormat=ecp_%v
KernelCommandLine=root=PARTLABEL=ecp-live_%v
                  ecp.live
                  systemd.mount-extra=tmpfs:/var:tmpfs:mode=0755,size=1G
                  systemd.mount-extra=tmpfs:/home:tmpfs:mode=0755,size=1G
                  systemd.mount-extra=PARTLABEL=ECP-LIVE-EXT:/var/lib/extensions:erofs:ro
                  ecp.pad=--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

[Output]
Output=ecp-installer_%v
RepartDirectories=%D/mkosi.repart.installer
# Nothing on the stick is ever updated, so the root and kernel image payloads are not needed.
SplitArtifacts=
SplitArtifacts=uki
