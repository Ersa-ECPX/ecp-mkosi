# Installer image: the same OS in a layout small enough for a USB stick. Build it with
#   scripts/build x86-64 --profile installer
# and keep the normal image (scripts/build x86-64) for QEMU testing. The live session starts the
# graphical installer (ersa-installer, from the foundation-installer package) automatically;
# `foundation deploy` also works from a terminal.
[Output]
Output=ecp-installer_%v
RepartDirectories=%D/mkosi.repart.installer
# Nothing on the stick is ever updated, so the root and kernel image payloads are not needed.
SplitArtifacts=
SplitArtifacts=uki
# The root image is the same as the normal build. The live session (liveuser:liveuser, automatic
# sign-in, the polkit rule, the installer autostart) is created at boot by ersa-live-session.service
# only when the ESP is labelled ECP-LIVE (mkosi.repart.installer/00-esp.conf), so none of it is in
# the image Deploy copies.
