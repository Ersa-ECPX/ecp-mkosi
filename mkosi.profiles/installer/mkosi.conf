# Installer image: the same OS in a layout small enough for a USB stick. Build it with
#   scripts/build x86-64 --profile installer
# and keep the normal image (scripts/build x86-64) for QEMU testing. The live session starts the
# graphical installer (ersa-installer) automatically; `foundation deploy` also works from a terminal.
#
# The root image is the same as the normal build, and so is how it mounts /var and /home (label-based, from the
# kernel command line, see mkosi.conf.d/30-data-mounts.conf). The medium has a small writable data volume
# (mkosi.repart.installer/30-data.conf) that holds /var and /home of the live session and the installer sysext
# (/var/lib/extensions/ersa-installer.raw), merged at boot by systemd-sysext.service; it brings the live
# session (liveuser, automatic sign-in, polkit rule, autostart), which therefore never exists in the
# image Deploy copies. scripts/build stages it with scripts/build-installer-sysext.
#
# (A read-only variant, with RAM disks for /var and /home and a read-only partition for the sysext, was tried and
# removed: its initrd mount for the /etc overlay failed and the medium booted into emergency mode.)
# The medium's root is under dm-verity like an installed system's, and is found from the kernel image's roothash= on the disk
# it booted from (labels ecp-live and ecp-live-verity), so an installed disk that is attached too cannot be taken for it.
[Content]
ExtraTrees=%D/mkosi.installer.extra:/
# The medium's own data volume is labelled ECP-LIVE, not ECP-DATA (mkosi.repart.installer/30-data.conf): an installed
# disk attached at the same time has an ECP-DATA volume, and mounting by that label could pick the installed disk's
# data instead (it then looked "in use" and could not be wiped). Same options as mkosi.conf.d/30-data-mounts.conf.
KernelCommandLine=systemd.mount-extra=LABEL=ECP-LIVE:/var:btrfs:subvol=var,x-initrd.mount
KernelCommandLine=systemd.mount-extra=LABEL=ECP-LIVE:/home:btrfs:subvol=home
KernelCommandLine=ecp.pad=--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

[Output]
Output=ecp-installer_%v
RepartDirectories=%D/mkosi.repart.installer
# Nothing on the stick is ever updated, so the root and kernel image payloads are not needed.
SplitArtifacts=
SplitArtifacts=uki
