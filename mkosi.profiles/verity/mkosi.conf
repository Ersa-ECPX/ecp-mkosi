# dm-verity profile (docs/features/dm-verity.md). EXPERIMENTAL: written, never built. Add it to the image profiles:
#   scripts/build x86-64 --profile root --profile verity          # the update payload with hash tree and .roothash
#   scripts/build x86-64 --profile verity                         # the A/B disk with a hash partition per slot
# The kernel command line then carries roothash= (mkosi adds it), the initrd needs the dm-verity module, and
# `foundation update install` takes the format 2 archive scripts/make-update-archive makes from these outputs.
[Output]
RepartDirectories=
RepartDirectories=%D/mkosi.repart.system-verity
SplitArtifacts=roothash

[Content]
KernelInitrdModules=/drivers/md/
# systemd-veritysetup loads libcryptsetup at run time; the initrd must have it to open the root
InitrdPackages=libcryptsetup12
