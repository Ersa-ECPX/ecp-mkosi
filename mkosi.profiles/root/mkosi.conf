# Update payload profile: the same OS, built only to produce the files an update needs. scripts/make-update-archive packs them
# into the archive that `foundation update install` and the update window install into the inactive slot, and the installer
# profile carries that archive as the system to install:
#   mkosi.output/root/ecp_<version>.root-x86-64.raw.zst          the root filesystem (EROFS, exactly as large as its contents)
#   mkosi.output/root/ecp_<version>.root-x86-64-verity.raw.zst   its dm-verity hash tree
#   mkosi.output/root/ecp_<version>.efi                          the signed kernel image (its command line has roothash=)
#   mkosi.output/root/ecp_<version>.roothash                     the root hash
# Build it with
#   scripts/build x86-64 --profile root --image-version <version>
# The normal image (scripts/build x86-64) remains the one to boot in QEMU; this one has a throwaway
# disk with no data volume and is never booted. Its own output directory keeps it from overwriting
# the normal image, which has the same name.
[Output]
OutputDirectory=%D/mkosi.output/root
RepartDirectories=%D/mkosi.repart.root
SplitArtifacts=
SplitArtifacts=uki
SplitArtifacts=partitions
SplitArtifacts=roothash
# Compresses the split root partition image (and the throwaway disk). The kernel image is copied as is.
CompressOutput=zstd
