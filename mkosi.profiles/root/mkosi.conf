# Update payload profile: the same OS, built only to produce the files an update needs, which
# systemd-sysupdate (or foundation, through it) downloads and writes to the inactive slot:
#   mkosi.output/root/ecp_<version>.root-x86-64.raw.zst   the root filesystem (EROFS, exactly as large
#                                                         as its contents, compressed with zstd)
#   mkosi.output/root/ecp_<version>.efi                   the kernel image (named for boot counting
#                                                         by the transfer file, ecp_<version>+3.efi)
#   mkosi.output/root/ecp_<version>.SHA256SUMS            checksums of all of them
# Build it with
#   scripts/build x86-64 --profile root
# The normal image (scripts/build x86-64) remains the one to boot in QEMU; this one has a throwaway
# disk with no data volume and is never booted. Its own output directory keeps it from overwriting
# the normal image, which has the same name.
[Output]
OutputDirectory=%D/mkosi.output/root
RepartDirectories=%D/mkosi.repart.root
SplitArtifacts=
SplitArtifacts=uki
SplitArtifacts=partitions
# Compresses the split root partition image (and the throwaway disk). The kernel image is copied as is.
CompressOutput=zstd
