# Secure Boot profile: sign systemd-boot and every kernel image (UKI) with the platform's own key, so a computer
# that trusts that key (and nothing else we did not sign) will boot them and refuse anything else. Combine it with
# the image profiles:
#   scripts/make-secure-boot-key                              # once; makes secure-boot/ersa-secure-boot.{key,crt}
#   scripts/build x86-64 --profile root --profile secureboot
#   scripts/build x86-64 --profile installer --profile secureboot
# Not signed here: the openSUSE kernel inside the UKI is not signed separately (the UKI is the signed unit), and
# firmware that only trusts Microsoft's keys (the usual default) will refuse these images until our certificate is
# enrolled (docs/features/secure-boot.md). The key stays outside git: secure-boot/ is ignored.
[Validation]
SecureBoot=yes
SecureBootKey=%D/secure-boot/ersa-secure-boot.key
SecureBootCertificate=%D/secure-boot/ersa-secure-boot.crt
# Enrolls the key by itself in a virtual machine whose firmware is in Setup Mode (systemd-boot does it; real computers
# need `secure-boot-enroll` in loader.conf or the firmware's own key menu, see the document above).
SecureBootAutoEnroll=yes
