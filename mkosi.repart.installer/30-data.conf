[Partition]
# A tiny writable volume for the live session: /var (logs, the /etc overlay's upper layer) and /home.
Type=linux-generic
# Not ECP-DATA: an installed disk has a volume of that name, and a disk with the same label as the one this medium
# mounts for /var made the live session take the installed disk's data volume, which then counted as "in use".
Label=ECP-LIVE
Format=btrfs
Subvolumes=/var /home
CopyFiles=/var:/var
CopyFiles=/home:/home
SizeMinBytes=512M
SizeMaxBytes=512M
SplitName=-
