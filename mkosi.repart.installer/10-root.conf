[Partition]
Type=root
# A different label from an installed slot (ecp-root_<version>), so that an installed disk attached at the same time
# is never mistaken for this root (mkosi.profiles/installer/mkosi.conf names it on the kernel command line).
Label=ecp-live_%A
Format=erofs
CopyFiles=/
ExcludeFiles=/var/
ExcludeFiles=/home/
ReadOnly=yes
# One slot only: the image is about 3.7 GiB with Firefox, so 5 GiB leaves headroom. The build fails
# (rather than truncating) if the image ever outgrows it.
SizeMinBytes=5G
SizeMaxBytes=5G
SplitName=-
