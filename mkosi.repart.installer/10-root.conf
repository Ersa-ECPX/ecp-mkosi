[Partition]
Type=root
# Same label scheme as the normal image, so the kernel image's root=PARTLABEL=ecp-root_<version> matches.
Label=ecp-root_%A
Format=erofs
CopyFiles=/
ExcludeFiles=/var/
ExcludeFiles=/home/
ReadOnly=yes
# One slot only: the image is about 3.7 GiB with Firefox, so 5 GiB leaves headroom. The build fails
# (rather than truncating) if the image ever outgrows it.
SizeMinBytes=5G
SizeMaxBytes=5G
SplitName=-
