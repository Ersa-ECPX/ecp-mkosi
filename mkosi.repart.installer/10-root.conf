# The medium's own root: the same image as an installed system, under dm-verity (hash tree in the next partition). It is
# found from the kernel image's roothash= on the disk it booted from, so an installed disk attached at the same time (same
# hash, other disk) cannot be taken for it. Labelled ecp-live so the installer never offers it as a slot.
[Partition]
Type=root
Label=ecp-live
Format=erofs
CopyFiles=/
ExcludeFiles=/var/
ExcludeFiles=/home/
ReadOnly=yes
# Exactly as large as its contents (about 5.8 GiB measured on the first build, most of it the payload), like the update image;
# the 96 MiB hash partition below is enough for a root of this size (a hash tree is about 1/128 of its data).
Minimize=best
SplitName=-
Verity=data
VerityMatchKey=root
