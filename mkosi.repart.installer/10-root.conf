[Partition]
Type=root
# A different label from the installed slot (ecp-root_<version>): see mkosi.profiles/installer/mkosi.conf.
Label=ecp-live_%A
Format=erofs
CopyFiles=/
ExcludeFiles=/var/
ExcludeFiles=/home/
ReadOnly=yes
# One slot only: the image is about 3.7 GiB with Firefox, so 5 GiB leaves headroom. The build fails
# (rather than truncating) if the image ever outgrows it.
SizeMinBytes=5G
SizeMaxBytes=5G
SplitName=-
