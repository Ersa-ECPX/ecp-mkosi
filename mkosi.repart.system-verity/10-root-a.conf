# dm-verity variant of the A/B layout (profile verity). Unverified: systemd-repart hashes the whole fixed-size partition here,
# while an update's hash tree covers only its image; the hash partition's superblock records the block count in both cases.
[Partition]
Type=root
Label=ecp-root-a
Format=erofs
CopyFiles=/
ExcludeFiles=/var/
ExcludeFiles=/home/
ReadOnly=yes
SizeMinBytes=8G
SizeMaxBytes=8G
Verity=data
VerityMatchKey=root
