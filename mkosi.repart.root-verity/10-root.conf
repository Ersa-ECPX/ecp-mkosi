# dm-verity variant of the update payload (profile verity). The data partition is as small as its contents; its hash tree is
# the next partition. mkosi puts roothash=<hash> on the kernel image's command line by itself.
[Partition]
Type=root
Label=ecp-root-a
Format=erofs
CopyFiles=/
ExcludeFiles=/var/
ExcludeFiles=/home/
ReadOnly=yes
Minimize=best
Verity=data
VerityMatchKey=root
