[Partition]
Type=esp
Label=ECP-ESP
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
# Holds the kernel image (about 105 MiB) so the build is a complete, bootable-shaped image; the
# payloads are split out of it, so this partition itself is not published.
SizeMinBytes=256M
SizeMaxBytes=256M
SplitName=-
