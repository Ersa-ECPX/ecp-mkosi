[Partition]
Type=root
Label=ecp-root_%A
Format=erofs
CopyFiles=/
ExcludeFiles=/var/
ExcludeFiles=/home/
ReadOnly=yes
# Exactly as large as the filesystem, so the published file is not padded to a slot's size. The slot
# it is written to (8 GiB) is larger; the filesystem records its own length and ignores the rest.
Minimize=best
