# The update payload: the root filesystem as small as its contents, under dm-verity, with its hash tree in the next
# partition. Both are split out (SplitArtifacts=partitions) together with ecp_<version>.roothash; scripts/make-update-archive
# turns them into a format 2 update.
[Partition]
Type=root
Label=ecp-root-a
Format=erofs
CopyFiles=/
ExcludeFiles=/var/
ExcludeFiles=/home/
ReadOnly=yes
Minimize=best
Verity=data
VerityMatchKey=root
