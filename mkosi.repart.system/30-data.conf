[Partition]
# The one writable volume: /var (system state, Flatpak apps, containers, the /etc overlay's upper
# layer) and /home (user data) are btrfs subvolumes that share its free space but can be snapshotted,
# backed up or reset separately. Each is a real mount (see mkosi.extra/etc/fstab), so SELinux labels
# /home by its own path; a bind mount of /var/home would not.
# Type is not "var" or "home": systemd-gpt-auto would then mount the whole volume at that path.
Type=linux-generic
Label=ECP-DATA
Format=btrfs
Subvolumes=/var /home
CopyFiles=/var:/var
CopyFiles=/home:/home
# At least what /var (8 GiB) and /home (2 GiB) used to get. Last partition, no maximum: it grows to
# fill a larger disk (first-boot growth is not set up yet).
SizeMinBytes=10G
SplitName=-
