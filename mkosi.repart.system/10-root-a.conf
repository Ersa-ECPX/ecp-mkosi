[Partition]
Type=root
# The label carries the image version so systemd-sysupdate knows which version occupies the slot,
# and so the matching UKI can find its root with root=PARTLABEL=ecp-root_<version>.
Label=ecp-root_%A
# Read-only EROFS, uncompressed: no decode cost on reads. (Kernel 7.3.1's config enables EROFS
# compression with lz4, zstd, deflate and lzma, so compression is an option if size matters more than
# read speed; measure boot time and app launch before choosing. The repart Compression= settings for
# erofs have not been tried here.)
Format=erofs
CopyFiles=/
ExcludeFiles=/var/
ExcludeFiles=/home/
ReadOnly=yes
# 8 GiB for a 3.3 GiB image: generous headroom for growth. A slot cannot be enlarged on an installed
# system without re-partitioning, so do not shrink this lightly. Both slots must be the same size.
SizeMinBytes=8G
SizeMaxBytes=8G
