# Root slot A: EROFS under dm-verity. Its hash tree is the next partition (ecp-verity-a). systemd finds the pair from the
# kernel image's roothash=: this partition's UUID is the first half of the root hash, the hash partition's the second half.
# The label never changes (slots are not named by version). mkosi puts roothash= on the kernel image's command line.
# Unverified: systemd-repart hashes the whole fixed-size partition here, while an update's hash tree covers only its image;
# the hash superblock records the block count either way.
[Partition]
Type=root
Label=ecp-root-a
Format=erofs
CopyFiles=/
ExcludeFiles=/var/
ExcludeFiles=/home/
ReadOnly=yes
SizeMinBytes=8G
SizeMaxBytes=8G
Verity=data
VerityMatchKey=root
