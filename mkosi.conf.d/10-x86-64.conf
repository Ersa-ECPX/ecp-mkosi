[Match]
Architecture=x86-64

[Content]
KernelCommandLine=ro quiet loglevel=3 panic=10 security=selinux selinux=1 splash plymouth.ignore-serial-consoles console=ttyS0,115200n8 console=tty0
# Hardware AES, SHA and carry-less multiplication, which dm-crypt prefers when the unlock happens in the initrd.
KernelInitrdModules=/arch/x86/crypto/
