[Match]
# The installer medium names its own data volume differently (see mkosi.profiles/installer/mkosi.conf).
Profiles=!installer

# /var and /home are subvolumes of the data volume. They are mounted from the kernel command line
# (systemd.mount-extra=, honoured in the initrd and in the running system), not from /etc/fstab, so that an
# installed system can name its own data partition by PARTUUID: `foundation deploy` rewrites these arguments
# (deploy.py, installed_cmdline). Mounting by label let a second disk with the same labels (the installer
# medium, another install) supply /var and /home by mistake.
#
# /var carries x-initrd.mount: a mount-extra= entry is only mounted before switch-root with that option (as the old
# fstab line did), and the /etc overlay in the initrd needs /sysroot/var. Without it the overlay failed to mount and
# the machine dropped to emergency mode.
#
# The label form below is for the images that have one data volume: development images in QEMU, the installer
# medium, and the root image that OTA updates are built from. ecp.pad= is ignored by the kernel; it only reserves room
# in the UKI's .cmdline section for the longer command line deploy writes.
[Content]
KernelCommandLine=systemd.mount-extra=LABEL=ECP-DATA:/var:btrfs:subvol=var,x-initrd.mount
                  systemd.mount-extra=LABEL=ECP-DATA:/home:btrfs:subvol=home
                  ecp.pad=--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
