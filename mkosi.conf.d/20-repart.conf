# The disk layout of the normal image (A/B root slots and a data volume). The installer and root
# profiles (mkosi.profiles/) use their own layouts instead; mkosi would otherwise merge the
# directories, so the default is named explicitly and applies only when neither profile is active.
[Match]
Profiles=!installer
Profiles=!root

[Output]
RepartDirectories=%D/mkosi.repart.system
