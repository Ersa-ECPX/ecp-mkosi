[Distribution]
Distribution=rocky
Release=10.2
Repositories=CRB,epel
RepositoryKeyFetch=yes

[Output]
Format=disk
ImageId=ecp
ImageVersion=0.1.0
ManifestFormat=json
OutputDirectory=mkosi.output

[Content]
Packages=kernel-core
         systemd
         systemd-udev
         NetworkManager
         plasma-workspace
         plasma-desktop
         sddm
         konsole
         dolphin
         kwin
         mesa-dri-drivers
         xorg-x11-server-Xwayland
         selinux-policy-targeted
         policycoreutils
         shadow-utils
         sudo
         passwd
         systemd-boot-unsigned
         plymouth
         plymouth-plugin-script
SELinuxRelabel=yes
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
KernelCommandLine=root=PARTUUID ro rhgb quiet
InitrdProfiles=plymouth
InitrdPackages=plymouth-plugin-script

[Build]
ToolsTree=yes
ToolsTreeDistribution=fedora
ToolsTreeRelease=45

[Validation]
Checksum=yes

[Config]
MinimumVersion=27.1
