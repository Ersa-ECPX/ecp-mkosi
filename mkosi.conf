[Distribution]
Distribution=opensuse
Release=tumbleweed
RepositoryKeyFetch=yes

[Output]
Format=disk
ImageId=ecp
ImageVersion=0.1.0
ManifestFormat=json
# Emit the UKI and the root partition image as separate files: these are the update payloads.
SplitArtifacts=uki,partitions
OutputDirectory=mkosi.output

[Content]
# Regional defaults. Without a locale the system runs in the C locale and GNOME Initial Setup's
# Welcome page preselects "Unspecified" instead of English (United States). The firstboot wizard
# stays disabled; users change these in Initial Setup or GNOME Settings.
# No Timezone= here: the build's `systemd-firstboot --timezone Asia/Kolkata` failed because the
# zone files were not in the build root. The time zone defaults to UTC until someone sets it.
Locale=en_US.UTF-8
Keymap=us
Packages=kernel-default
         # Early boot and the A/B update tools (systemd-sysupdate ships in systemd-experimental;
         # systemd-repart, bootctl and systemd-bless-boot are in udev)
         systemd
         systemd-experimental
         udev
         systemd-boot
         systemd-ukify
         openSUSE-release
         # CPU microcode and firmware for common PC hardware
         ucode-intel
         ucode-amd
         kernel-firmware-intel
         kernel-firmware-amdgpu
         kernel-firmware-i915
         kernel-firmware-iwlwifi
         kernel-firmware-realtek
         kernel-firmware-mediatek
         kernel-firmware-atheros
         kernel-firmware-bluetooth
         kernel-firmware-network
         kernel-firmware-sound
         # Desktop session
         gdm
         gdm-branding-upstream
         gnome-shell
         gnome-session
         gnome-initial-setup
         gnome-control-center
         gnome-keyring
         xdg-desktop-portal-gnome
         xdg-desktop-portal-gtk
         xdg-user-dirs
         xdg-user-dirs-gtk
         xdg-utils
         Mesa-dri
         xwayland
         polkit
         dbus-broker
         glibc-locale
         timezone
         kbd
         # Networking, Bluetooth and calls through a paired phone
         NetworkManager
         NetworkManager-bluetooth
         NetworkManager-wwan
         NetworkManager-tui
         wpa_supplicant
         ModemManager
         firewalld
         # Network tools: ping, ip, traceroute, ethtool, curl, iw, tcpdump (dig and wget come with bind-utils/wget)
         iputils
         iproute2
         traceroute
         ethtool
         curl
         iw
         tcpdump
         bluez
         bluez-obexd
         gnome-bluetooth
         ersa-bluetooth
         ersa-dialer
         # Audio (the Bluetooth plugin is part of pipewire-spa-plugins-0_2)
         pipewire
         pipewire-pulseaudio
         pipewire-alsa
         pipewire-spa-plugins-0_2
         wireplumber
         # Files, disks and storage
         nautilus
         sushi
         file-roller
         gvfs
         gvfs-backend-afc
         gvfs-backend-samba
         gvfs-backend-goa
         gvfs-backend-gphoto
         gvfs-fuse
         gnome-disk-utility
         udisks2
         baobab
         btrfsprogs
         mtools
         e2fsprogs
         xfsprogs
         dosfstools
         exfatprogs
         ntfs-3g
         ntfsprogs
         unzip
         zip
         7zip
         # Applications
         ghostty
         gnome-text-editor
         loupe
         papers
         showtime
         gnome-calculator
         gnome-clocks
         gnome-characters
         gnome-contacts
         gnome-calendar
         gnome-weather
         gnome-maps
         gnome-system-monitor
         gnome-font-viewer
         gnome-extensions-app
         gnome-tweaks
         snapshot
         flatpak
         # Web browser from the openSUSE repository (Zen Browser is not in it and a Flatpak is not part
         # of the image). Upstream branding: the openSUSE branding package sets openSUSE's start page.
         MozillaFirefox
         MozillaFirefox-branding-upstream
         MozillaFirefox-translations-common
         # Developer tools (heavier toolchains belong in toolbox containers)
         git
         python3
         python3-pip
         gcc
         gcc-c++
         clang
         make
         cmake
         gdb
         podman
         toolbox
         distrobox
         # Fonts
         adwaita-fonts
         dejavu-fonts
         liberation-fonts
         google-noto-sans-fonts
         google-noto-serif-fonts
         google-noto-sans-mono-fonts
         google-noto-coloremoji-fonts
         # Fonts for every script the installer's language list and greeting use (about 300 MB):
         # Japanese, Chinese (simplified and traditional), Korean; Thai, Lao, Khmer, Myanmar; the Indian
         # scripts (Devanagari, Bengali, Gujarati, Gurmukhi, Kannada, Malayalam, Tamil, Telugu, Odia, Ol Chiki,
         # Meetei Mayek) and Sinhala; Arabic script (Arabic, Persian, Urdu: UI, Naskh and Nastaliq);
         # Hebrew, Armenian, Georgian, Ethiopic; symbols and math.
         google-noto-sans-cjk-fonts
         google-noto-sans-thai-fonts
         google-noto-sans-lao-fonts
         google-noto-sans-khmer-fonts
         google-noto-sans-myanmar-fonts
         google-noto-sans-devanagari-fonts
         google-noto-sans-bengali-fonts
         google-noto-sans-gujarati-fonts
         google-noto-sans-gurmukhi-fonts
         google-noto-sans-kannada-fonts
         google-noto-sans-malayalam-fonts
         google-noto-sans-tamil-fonts
         google-noto-sans-telugu-fonts
         google-noto-sans-oriya-fonts
         google-noto-sans-olchiki-fonts
         google-noto-sans-meeteimayek-fonts
         google-noto-sans-sinhala-fonts
         google-noto-sans-arabic-fonts
         google-noto-naskharabic-fonts
         google-noto-nastaliqurdu-fonts
         google-noto-sans-hebrew-fonts
         google-noto-sans-armenian-fonts
         google-noto-sans-georgian-fonts
         google-noto-sans-ethiopic-fonts
         google-noto-sans-symbols-fonts
         google-noto-sans-symbols2-fonts
         google-noto-sans-math-fonts
         # Multimedia, from openSUSE's own repository. Its FFmpeg is built "limited in the number of codecs
         # supported" (no H.264, H.265 or AAC decoding), so the full codecs are an optional extension that
         # `foundation ext` assembles on the machine from Packman's packages; everything below is what ships.
         # Audio: MP3, AAC (fdk-aac, faad2), Opus, Vorbis, FLAC, Speex. Video: VP8/VP9, AV1 (dav1d, aom,
         # SVT-AV1), Theora. Images: WebP, HEIF, JPEG XL. Subtitles: libass.
         ffmpeg
         gstreamer-plugins-good
         gstreamer-plugins-good-extra
         gstreamer-plugins-bad
         gstreamer-plugins-ugly
         gstreamer-plugins-libav
         libfdk-aac2
         libfaad2
         libmp3lame0
         libmpg123-0
         libopus0
         libvorbis0
         libvorbisenc2
         libFLAC14
         libspeex1
         libvpx12
         libaom3
         libdav1d7
         libSvtAv1Enc4
         libtheora1
         libheif1
         libwebp7
         libjxl0_12
         libass9
         # Hardware video decode and encode: VA-API (Intel, AMD), the VDPAU bridge and Intel oneVPL.
         Mesa-libva
         intel-media-driver
         libva-utils
         libva-drm2
         libva-wayland2
         libvdpau_va_gl1
         libvpl2
         # ECP management CLI (built from foundation/ by scripts/build-foundation-package)
         foundation
         foundationd
         # For the installer sysext (scripts/build-installer-sysext), which carries only its own files
         python3-gobject
         # What foundationd runs: rpm and rpm2cpio (compat packages), sfdisk (boot slot labels) and
         # the libflatpak bindings (applications). Recommended packages are not installed by default.
         rpm
         util-linux
         typelib-1_0-Flatpak-1_0
         # Base system. SELinux is openSUSE Tumbleweed's default security module (since snapshot
         # 20250211); container-selinux is for podman.
         selinux-policy-targeted
         selinux-tools
         selinux-autorelabel
         policycoreutils
         container-selinux
         shadow
         sudo
         # GNOME creates the first user with `useradd -G wheel`: the group must exist, and members
         # must be administrators with their own password (the image has no root password).
         system-group-wheel
         sudo-policy-wheel-auth-self
         bash-completion
         man
         less
         vim
         wget
         rsync
         openssh-clients
         bind-utils
         # Boot splash (neutral upstream branding; the Ersa theme replaces the default)
         plymouth
         plymouth-branding-upstream
         plymouth-plugin-script
         plymouth-plugin-label
         ersa-boot-splash
PackageDirectories=mkosi.packages
# Logos rendered from branding/*.svg by scripts/build-branding (replaces the distribution logos).
ExtraTrees=%D/mkosi.branding
SELinuxRelabel=yes
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
# One UKI per root slot, named by image version so systemd-sysupdate can manage the pair. The
# literal +3 is the initial boot counter (3 tries): mkosi 27.1 only appends a counter for its
# default name format, so a custom format must carry it itself. systemd-bless-boot removes it
# once a boot is judged good.
UnifiedKernelImageFormat=ecp_%v+3
InitrdProfiles=plymouth
# EROFS, btrfs and overlayfs are modules in the openSUSE kernel (checked in the kernel-default config).
# The initrd must mount the root slot, /var (a btrfs subvolume) and the /etc overlay (mkosi.initrd.extra).
KernelInitrdModules=default /fs/erofs/ /fs/btrfs/ /fs/overlayfs/
# No font package in the initrd: every openSUSE font package requires perl, which adds about 55 MB.
# The splash text (Image.Text) is only used after switch-root, where the main image's fonts exist.
InitrdPackages=plymouth-plugin-script plymouth-plugin-label ersa-boot-splash fontconfig

[Build]
ToolsTree=yes
# The tools tree provides the zypper and rpm that install the image. Use the target's own
# (Tumbleweed) tooling: with the Fedora 45 tools tree (rpm 6.1.0), installs of the perl package
# stalled for hours, and rpm 6.1.0 rejected some Tumbleweed signatures ("V3 RSA/SHA512 ... NOKEY").
# Tumbleweed's own zypper installed perl in about 8 s in a container test. Delete mkosi.tools and
# mkosi.tools.manifest after changing this so the tree is rebuilt.
ToolsTreeDistribution=opensuse
ToolsTreeRelease=tumbleweed

[Validation]
Checksum=yes

[Config]
MinimumVersion=27.1

[Runtime]
# Transfer definitions used by `mkosi sysupdate` (and shipped in the image).
SysupdateDirectory=mkosi.extra/usr/lib/sysupdate.d
