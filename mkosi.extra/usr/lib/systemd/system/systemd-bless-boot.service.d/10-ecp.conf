# graphical.target.d/10-ecp-boot-assessment.conf pulls this unit in on every boot, but it only makes sense
# when systemd-boot started the entry with a boot counter (it sets LoaderBootCountPath then). Without one
# (every boot after the first, once the entry is blessed) the unit used to fail with "Not booted with boot
# counting in effect". Skip it instead, and only bless once the graphical target is up.
[Unit]
ConditionPathExists=/sys/firmware/efi/efivars/LoaderBootCountPath-4a67b082-0a4c-41cf-b6c7-440b29bb8c4f
After=graphical.target
