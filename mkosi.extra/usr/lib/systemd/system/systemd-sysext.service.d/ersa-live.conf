# After extensions are merged, start the live session if one of them provides it (the installer medium's
# sysext does). A unit merged in mid-boot is not part of the boot's job list, and the manager reload the
# merge requests is asynchronous, so reload explicitly and then start it. The "-" ignores the failure on
# every other system, where there is no such unit; without extensions this service is skipped altogether.
[Service]
ExecStartPost=-/usr/bin/systemctl daemon-reload
ExecStartPost=-/usr/bin/systemctl start ersa-live-session.service
